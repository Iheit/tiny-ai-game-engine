name: Windows Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\TinyAI-Game-Engine\runtime | Out-Null
          New-Item -ItemType Directory -Force dist\TinyAI-Game-Engine\templates | Out-Null
          Copy-Item build\Release\TinyAIEditor.exe dist\TinyAI-Game-Engine\
          Copy-Item build\Release\TinyAIRuntime.exe dist\TinyAI-Game-Engine\runtime\
          Copy-Item templates\* dist\TinyAI-Game-Engine\templates\ -Recurse
          Copy-Item README.md dist\TinyAI-Game-Engine\
          Compress-Archive -Path dist\TinyAI-Game-Engine -DestinationPath dist\TinyAI-Game-Engine-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TinyAI-Game-Engine-Windows-x64
          path: dist/TinyAI-Game-Engine-Windows-x64.zip
