name: Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-make
            zip

      - name: Configure and build engine
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Assemble self-contained package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist/Tiny AI Game Engine'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/TinyAICompiler/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/TinyAICompiler/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/TinyAICompiler/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/TinyAICompiler/share" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/Engine" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/Templates" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/Runtime" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/bin" | Out-Null

          Copy-Item 'build/Tiny3DEngine.exe' "$root/TinyAIEditor.exe"
          Copy-Item 'TinyAICompiler/README.md' "$root/TinyAICompiler/README.md"
          Copy-Item 'Engine/README.md' "$root/Engine/README.md"
          Copy-Item 'Templates/README.md' "$root/Templates/README.md"
          Copy-Item 'Runtime/README.md' "$root/Runtime/README.md"

          $mingw = 'C:\msys64\mingw64'
          Copy-Item "$mingw/bin/g++.exe" "$root/TinyAICompiler/bin/"
          Copy-Item "$mingw/bin/gcc.exe" "$root/TinyAICompiler/bin/"
          Copy-Item "$mingw/bin/g++-*.exe" "$root/TinyAICompiler/bin/" -ErrorAction SilentlyContinue
          Copy-Item "$mingw/bin/ld.exe" "$root/TinyAICompiler/bin/"
          Copy-Item "$mingw/bin/as.exe" "$root/TinyAICompiler/bin/"
          Copy-Item "$mingw/bin/ar.exe" "$root/TinyAICompiler/bin/"
          Copy-Item "$mingw/bin/ranlib.exe" "$root/TinyAICompiler/bin/"
          Copy-Item "$mingw/bin/windres.exe" "$root/TinyAICompiler/bin/" -ErrorAction SilentlyContinue
          Copy-Item "$mingw/lib/*" "$root/TinyAICompiler/lib/" -Recurse -Force
          Copy-Item "$mingw/include/*" "$root/TinyAICompiler/include/" -Recurse -Force
          Copy-Item "$mingw/lib/gcc/x86_64-w64-mingw32/*" "$root/TinyAICompiler/lib/" -Recurse -Force
          Copy-Item "$mingw/libexec/gcc/*" "$root/TinyAICompiler/share/" -Recurse -Force -ErrorAction SilentlyContinue

          @'
          Tiny AI Game Engine

          Self-contained Windows developer package.
          Run TinyAIEditor.exe to start.
          The bundled TinyAICompiler contains the C++ toolchain used for game builds.
          '@ | Set-Content "$root/README.txt"

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Tiny AI Game Engine' -DestinationPath 'dist/TinyAI-Game-Engine-Windows-x64.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TinyAI-Game-Engine-Windows-x64
          path: dist/TinyAI-Game-Engine-Windows-x64.zip
          if-no-files-found: error
