name: Windows x64
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke editor binary
        run: if (!(Test-Path build\Release\TinyAIEditor.exe)) { throw 'Editor was not produced' }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\TinyAI-Game-Engine | Out-Null
          Copy-Item build\Release\TinyAIEditor.exe package\TinyAI-Game-Engine\
          Copy-Item build\Release\TinyAIRuntime.exe package\TinyAI-Game-Engine\
          Copy-Item README.md package\TinyAI-Game-Engine\
          Compress-Archive -Path package\TinyAI-Game-Engine -DestinationPath TinyAI-Game-Engine-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyAI-Game-Engine-Windows-x64
          path: TinyAI-Game-Engine-Windows-x64.zip
          if-no-files-found: error
