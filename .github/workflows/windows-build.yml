name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\TinyAI-Game-Engine\runtime | Out-Null
          New-Item -ItemType Directory -Force -Path package\TinyAI-Game-Engine\templates | Out-Null
          Copy-Item build\Release\TinyAIEditor.exe package\TinyAI-Game-Engine\
          Copy-Item build\Release\TinyAIRuntime.exe package\TinyAI-Game-Engine\runtime\
          Copy-Item templates\* package\TinyAI-Game-Engine\templates\ -Recurse
          Copy-Item README.md package\TinyAI-Game-Engine\
          Compress-Archive -Path package\TinyAI-Game-Engine -DestinationPath TinyAI-Game-Engine-Windows-x64.zip -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TinyAI-Game-Engine-Windows-x64
          path: TinyAI-Game-Engine-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
